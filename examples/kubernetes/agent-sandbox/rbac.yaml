# What the orchestrator needs in the task namespace with backend: sandbox.
# Namespaced only; the agent-sandbox controller's own cluster-wide rights are
# the platform's, not the orchestrator's.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smithy-orchestrator-tasks
  namespace: smithy-tasks
rules:
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [create, get, list, watch, patch, update, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  # kubectl exec POSTs (create); a client that upgrades to a WebSocket, as the
  # orchestrator's fabric8 does, GETs (get). Both, or exec is Forbidden.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # watch: remove waits for the task's claim to be gone.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smithy-orchestrator-tasks
  namespace: smithy-tasks
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: smithy-orchestrator-tasks
subjects:
  - kind: ServiceAccount
    name: smithy-orchestrator
    # The namespace the orchestrator Deployment runs in.
    namespace: smithy
